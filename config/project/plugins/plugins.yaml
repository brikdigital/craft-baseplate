      -
        __assoc__:
          -
            - severity
            - rate_limited
          -
            - action
            - logWarning
      -
        __assoc__:
          -
            - severity
            - rejected
          -
            - action
            - logWarning
      -
        __assoc__:
          -
            - severity
            - failure
          -
            - action
            - failQueue
