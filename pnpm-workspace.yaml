allowBuilds:
  "@swc/core": true
  esbuild: true
  lefthook: true
  puppeteer: true
  sharp: true

supportedArchitectures:
  cpu:
    - arm64
    - x64
  os:
    - darwin
    - linux
  libc:
    - glibc
    - musl

strictDepBuilds: false
strictSsl: true

